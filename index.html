```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Learn to Fly 2</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    ruffle-player {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};

    window.RufflePlayer.config = {
      autoplay: "on"
    };

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();

    document.getElementById("game").appendChild(player);

    player.load("game.swf");
  </script>
</body>
</html>
